<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#10261f">
  <title>Asset Flow</title>
  <style>
    :root{color-scheme:light;--ink:#17231f;--muted:#68756f;--line:#dfe7e3;--bg:#f3f6f4;--card:#fff;--brand:#173e31;--brand2:#d9ede4;--red:#b44848;--green:#287556;--shadow:0 10px 32px rgba(22,51,40,.08)}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,"Noto Sans JP",system-ui,-apple-system,sans-serif}.app{max-width:520px;margin:auto;min-height:100dvh;padding:env(safe-area-inset-top) 16px calc(92px + env(safe-area-inset-bottom))}header{display:flex;align-items:center;justify-content:space-between;padding:20px 3px 14px}h1{font-size:20px;margin:0;font-weight:650}.sub{color:var(--muted);font-size:12px;margin-top:4px}.icon-btn,.ghost,.primary,.tab{font:inherit;cursor:pointer}.icon-btn{border:0;background:transparent;font-size:19px;padding:10px;border-radius:12px}.hero{background:var(--brand);color:#fff;padding:22px;border-radius:24px;box-shadow:var(--shadow)}.hero-label{font-size:12px;opacity:.75}.hero-value{font-size:32px;letter-spacing:-.04em;margin:8px 0;font-weight:650}.hero-meta{font-size:12px;opacity:.82}.section-title{display:flex;align-items:center;justify-content:space-between;margin:24px 3px 11px}.section-title h2{font-size:15px;margin:0}.ghost{border:0;background:transparent;color:var(--green);padding:7px;font-size:12px}.accounts{display:grid;gap:10px}.account{background:var(--card);border-radius:18px;padding:16px;box-shadow:0 3px 12px rgba(27,47,39,.045)}.account-top{display:flex;align-items:center;justify-content:space-between;gap:10px}.account-name{font-size:14px;font-weight:650}.account-type{font-size:11px;color:var(--muted);margin-top:3px}.account-value{font-size:17px;font-weight:650;text-align:right}.account-pl{font-size:11px;color:var(--muted);text-align:right;margin-top:3px}.meter{height:5px;background:#e9efec;border-radius:999px;margin-top:13px;overflow:hidden}.meter span{display:block;height:100%;background:var(--green);border-radius:inherit}.empty{background:var(--card);border-radius:18px;padding:28px 18px;text-align:center;color:var(--muted);font-size:13px}.fab{position:fixed;bottom:calc(78px + env(safe-area-inset-bottom));right:max(20px,calc((100vw - 500px)/2));border:0;border-radius:999px;background:var(--brand);color:#fff;padding:14px 18px;font-weight:650;box-shadow:0 8px 24px rgba(16,49,37,.24)}nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,520px);display:grid;grid-template-columns:repeat(3,1fr);background:rgba(255,255,255,.94);backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:7px 10px calc(8px + env(safe-area-inset-bottom));z-index:4}.tab{border:0;background:transparent;color:var(--muted);padding:9px;font-size:11px;border-radius:12px}.tab.active{color:var(--brand);background:var(--brand2);font-weight:650}.view[hidden]{display:none}.panel{background:var(--card);border-radius:20px;padding:18px}.panel h2{font-size:17px;margin:0 0 17px}.field{display:grid;gap:6px;margin-bottom:14px}.field label{font-size:12px;color:var(--muted)}input,select{width:100%;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);padding:13px;font:inherit;font-size:16px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.segmented{display:grid;grid-template-columns:1fr 1fr;background:#edf2ef;padding:4px;border-radius:13px;margin-bottom:16px}.segmented button{border:0;background:transparent;padding:10px;border-radius:10px;font:inherit;font-size:13px}.segmented button.active{background:#fff;box-shadow:0 2px 7px rgba(0,0,0,.07);font-weight:650}.primary{width:100%;border:0;border-radius:13px;background:var(--brand);color:#fff;padding:14px;font-weight:650;margin-top:4px}.calc{background:var(--brand2);border-radius:15px;padding:14px;margin:4px 0 15px}.calc-row{display:flex;justify-content:space-between;gap:12px;font-size:13px}.calc-row+.calc-row{margin-top:8px}.calc strong{font-size:15px}.notice{font-size:11px;color:var(--muted);line-height:1.6;margin:12px 2px}.tx{display:grid;grid-template-columns:1fr auto;gap:10px;padding:13px 3px;border-bottom:1px solid var(--line)}.tx:last-child{border-bottom:0}.tx-name{font-size:13px;font-weight:650}.tx-meta{font-size:11px;color:var(--muted);margin-top:4px}.tx-value{text-align:right;font-size:13px;font-weight:650}.tx-units{font-size:11px;color:var(--muted);margin-top:4px}.prototype{background:#fff4d7;color:#6b5318;border-radius:13px;padding:10px 12px;font-size:11px;line-height:1.5;margin-bottom:14px}@media(max-width:360px){.grid2{grid-template-columns:1fr}.hero-value{font-size:28px}}
  </style>
</head>
<body>
  <div class="app">
    <header><div><h1>Asset Flow</h1><div class="sub">資産を、口座ごとに見渡す</div></div><button class="icon-btn" id="mask" aria-label="金額を隠す">◉</button></header>
    <div class="prototype">試作版：入力データはこの端末内だけに保存されます。実データの投入はクラウド認証・暗号化を実装してから行ってください。</div>
    <main>
      <section class="view" id="homeView">
        <div class="hero"><div class="hero-label">総資産評価額</div><div class="hero-value money" id="totalValue">¥0</div><div class="hero-meta">預金と3つの証券口座を合算</div></div>
        <div class="section-title"><h2>証券口座別</h2><button class="ghost" data-go="addView">取引を追加</button></div>
        <div class="accounts" id="accounts"></div>
        <div class="section-title"><h2>銀行預金</h2><button class="ghost" id="addBankShortcut">残高を入力</button></div>
        <div class="accounts" id="banks"></div>
        <div class="section-title"><h2>最近の取引</h2></div><div class="panel" id="recent"></div>
      </section>

      <section class="view" id="addView" hidden>
        <div class="panel">
          <h2>取引を追加</h2>
          <div class="segmented" style="grid-template-columns:repeat(3,1fr)"><button id="stockMode" class="active">株式・ETF</button><button id="fundMode">投資信託</button><button id="bankMode">預金残高</button></div>
          <form id="tradeForm">
            <div id="investmentFields">
              <div class="field"><label for="account">証券口座</label><select id="account"><option>楽天証券</option><option>マネックス証券</option><option>SBI証券</option></select></div>
              <div class="grid2"><div class="field"><label for="accountType">口座区分</label><select id="accountType"><option>NISA</option><option>特定口座</option><option>一般口座</option></select></div><div class="field"><label for="tradeDate">約定日</label><input id="tradeDate" type="date"></div></div>
              <div class="field"><label for="symbol">ティッカー／ファンド名</label><input id="symbol" placeholder="例：AAPL / eMAXIS Slim 全世界株式"></div>
              <div id="stockFields">
              <div class="grid2"><div class="field"><label for="quantity">数量</label><input id="quantity" type="number" min="0" step="any" placeholder="10"></div><div class="field"><label for="unitPrice">約定単価</label><input id="unitPrice" type="number" min="0" step="any" placeholder="150"></div></div>
              <div class="grid2"><div class="field"><label for="currency">通貨</label><select id="currency"><option value="JPY">円</option><option value="USD">米ドル</option></select></div><div class="field"><label for="fx">約定時為替</label><input id="fx" type="number" min="0" step="any" value="1"></div></div>
              <div class="field"><label for="fees">手数料・税</label><input id="fees" type="number" min="0" step="any" value="0"></div>
              </div>
              <div id="fundFields" hidden>
              <div class="grid2"><div class="field"><label for="amount">積立・買付金額</label><input id="amount" type="number" min="0" step="1" placeholder="30000"></div><div class="field"><label for="nav">約定基準価額（1万口）</label><input id="nav" type="number" min="0" step="1" placeholder="15000"></div></div>
              <div class="calc"><div class="calc-row"><span>今回増える口数</span><strong id="calcUnits">—</strong></div><div class="calc-row"><span>約定金額</span><span id="calcAmount">—</span></div></div>
              </div>
            </div>
            <div id="bankFields" hidden>
              <div class="field"><label for="bankName">銀行名</label><input id="bankName" value="三菱UFJ銀行" placeholder="銀行名"></div>
              <div class="grid2"><div class="field"><label for="bankType">口座種別</label><select id="bankType"><option>普通預金</option><option>定期預金</option><option>その他</option></select></div><div class="field"><label for="bankDate">残高基準日</label><input id="bankDate" type="date"></div></div>
              <div class="field"><label for="bankBalance">現在残高</label><input id="bankBalance" type="number" min="0" step="1" placeholder="500000"></div>
            </div>
            <button class="primary" id="saveButton" type="submit">取引を保存</button>
            <div class="notice">CSV取込も同じ取引形式へ変換します。重複候補がある場合は保存前に確認する設計です。</div>
          </form>
        </div>
      </section>

      <section class="view" id="historyView" hidden><div class="panel"><h2>取引履歴</h2><div id="history"></div></div></section>
    </main>
    <button class="fab" data-go="addView">＋ 取引を追加</button>
  </div>
  <nav><button class="tab active" data-go="homeView">ホーム</button><button class="tab" data-go="addView">入力</button><button class="tab" data-go="historyView">履歴</button></nav>
  <script>
    const ACCOUNTS=['楽天証券','マネックス証券','SBI証券'];
    const key='asset-flow-prototype-v1',bankKey='asset-flow-banks-v1';
    let trades=JSON.parse(localStorage.getItem(key)||'[]'),bankBalances=JSON.parse(localStorage.getItem(bankKey)||'[]'),mode='stock',masked=false;
    const yen=n=>new Intl.NumberFormat('ja-JP',{style:'currency',currency:'JPY',maximumFractionDigits:0}).format(n||0);
    const esc=s=>String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    document.getElementById('tradeDate').value=new Date().toISOString().slice(0,10);
    function totals(){return ACCOUNTS.map(name=>({name,value:trades.filter(t=>t.account===name).reduce((s,t)=>s+t.value,0)}))}
    function money(n){return masked?'¥••••••':yen(n)}
    function render(){
      const grouped=totals(),bankTotal=bankBalances.reduce((s,b)=>s+b.balance,0),total=grouped.reduce((s,a)=>s+a.value,0)+bankTotal,max=Math.max(...grouped.map(a=>a.value),1);
      document.getElementById('totalValue').textContent=money(total);
      document.getElementById('accounts').innerHTML=grouped.map(a=>`<article class="account"><div class="account-top"><div><div class="account-name">${a.name}</div><div class="account-type">NISA・特定・一般を合算</div></div><div><div class="account-value money">${money(a.value)}</div><div class="account-pl">取得金額ベース</div></div></div><div class="meter"><span style="width:${a.value/max*100}%"></span></div></article>`).join('');
      document.getElementById('banks').innerHTML=bankBalances.length?bankBalances.map(b=>`<article class="account"><div class="account-top"><div><div class="account-name">${esc(b.name)}</div><div class="account-type">${esc(b.type)}・${b.date}時点</div></div><div class="account-value money">${money(b.balance)}</div></div></article>`).join(''):'<div class="empty">預金残高を入力すると総資産に合算されます</div>';
      const rows=trades.slice().reverse().map(t=>`<div class="tx"><div><div class="tx-name">${esc(t.symbol)}</div><div class="tx-meta">${t.account}・${t.accountType}・${t.date}</div></div><div><div class="tx-value money">${money(t.value)}</div><div class="tx-units">${t.kind==='fund'?t.quantity.toLocaleString()+'口':t.quantity+'株'}</div></div></div>`).join('');
      const empty='<div class="empty">取引はまだありません</div>';document.getElementById('recent').innerHTML=rows.slice(0,4)||empty;document.getElementById('history').innerHTML=rows||empty;
      localStorage.setItem(key,JSON.stringify(trades));localStorage.setItem(bankKey,JSON.stringify(bankBalances));
    }
    function go(id){document.querySelectorAll('.view').forEach(v=>v.hidden=v.id!==id);document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.go===id));document.querySelector('.fab').hidden=id==='addView'}
    document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
    document.getElementById('mask').onclick=()=>{masked=!masked;render()};
    function setMode(next){mode=next;document.getElementById('investmentFields').hidden=next==='bank';document.getElementById('bankFields').hidden=next!=='bank';document.getElementById('stockFields').hidden=next!=='stock';document.getElementById('fundFields').hidden=next!=='fund';document.getElementById('stockMode').classList.toggle('active',next==='stock');document.getElementById('fundMode').classList.toggle('active',next==='fund');document.getElementById('bankMode').classList.toggle('active',next==='bank');document.getElementById('saveButton').textContent=next==='bank'?'預金残高を保存':'取引を保存'}
    document.getElementById('stockMode').onclick=()=>setMode('stock');document.getElementById('fundMode').onclick=()=>setMode('fund');document.getElementById('bankMode').onclick=()=>setMode('bank');document.getElementById('addBankShortcut').onclick=()=>{go('addView');setMode('bank')};
    function calcFund(){const amount=+document.getElementById('amount').value,nav=+document.getElementById('nav').value,units=nav?Math.floor(amount/nav*10000):0;document.getElementById('calcUnits').textContent=units?units.toLocaleString()+'口':'—';document.getElementById('calcAmount').textContent=amount?yen(amount):'—';return units}
    document.getElementById('amount').oninput=calcFund;document.getElementById('nav').oninput=calcFund;
    document.getElementById('tradeForm').onsubmit=e=>{e.preventDefault();if(mode==='bank'){const name=document.getElementById('bankName').value.trim(),balance=+document.getElementById('bankBalance').value,date=document.getElementById('bankDate').value;if(!name||!date||Number.isNaN(balance))return alert('銀行名・残高・基準日を入力してください');const item={id:crypto.randomUUID(),name,type:document.getElementById('bankType').value,balance,date};const old=bankBalances.findIndex(b=>b.name===name&&b.type===item.type);old>=0?bankBalances.splice(old,1,item):bankBalances.push(item);}else{let quantity,value;if(!document.getElementById('symbol').value.trim()||!document.getElementById('tradeDate').value)return alert('銘柄と約定日を入力してください');if(mode==='fund'){quantity=calcFund();value=+document.getElementById('amount').value;if(!quantity)return alert('買付金額と約定基準価額を入力してください');}else{quantity=+document.getElementById('quantity').value;value=quantity*(+document.getElementById('unitPrice').value)*(+document.getElementById('fx').value)+(+document.getElementById('fees').value);if(!quantity||!value)return alert('数量と約定単価を入力してください');}trades.push({id:crypto.randomUUID(),kind:mode,account:document.getElementById('account').value,accountType:document.getElementById('accountType').value,date:document.getElementById('tradeDate').value,symbol:document.getElementById('symbol').value.trim(),quantity,value});}e.target.reset();const today=new Date().toISOString().slice(0,10);document.getElementById('tradeDate').value=today;document.getElementById('bankDate').value=today;document.getElementById('bankName').value='三菱UFJ銀行';document.getElementById('fx').value=1;setMode(mode);render();go('homeView')};
    document.getElementById('bankDate').value=document.getElementById('tradeDate').value;render();
  </script>
</body>
</html>
